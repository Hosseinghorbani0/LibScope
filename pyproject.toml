[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "libscope"
version = "0.1.0"
description = "Open-Source Software Intelligence Platform. Beyond Downloads."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "LibScope Maintainers", email = "maintainers@libscope.dev" }
]
keywords = [
    "software-intelligence",
    "open-source",
    "package-analytics",
    "pypi",
    "github",
    "dependency-analysis",
    "adoption-discovery",
    "security-scoring"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "aiosqlite>=0.20.0",
    "askai-python>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
libscope = "libscope.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["libscope*", "packages*", "apps*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = [".", "packages/core", "packages/providers", "packages/analyzers", "packages/scoring", "packages/reporting", "packages/ai", "apps/api", "apps/cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line-too-long (enforced by line-length setting)
# B008: FastAPI uses Depends()/Query()/Argument() in function defaults by design
ignore = ["E501", "B008"]
