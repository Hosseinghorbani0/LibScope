version: "3.8"

services:
  libscope:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libscope-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LIBSCOPE_ENVIRONMENT=production
      - LIBSCOPE_API_KEY=${LIBSCOPE_API_KEY:?Set LIBSCOPE_API_KEY in the environment}
      - LIBSCOPE_DEBUG=false
      - LIBSCOPE_DATABASE_URL=sqlite:////app/data/libscope.db
      - LIBSCOPE_ENABLE_DEMO_MODE=false
      - LIBSCOPE_CORS_ORIGINS=${LIBSCOPE_CORS_ORIGINS:-http://localhost:5173}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - LIBSCOPE_AI_PROVIDER=${LIBSCOPE_AI_PROVIDER:-openrouter}
      - LIBSCOPE_AI_API_KEY=${LIBSCOPE_AI_API_KEY:-}
      - LIBSCOPE_AI_MODEL=${LIBSCOPE_AI_MODEL:-openai/gpt-4o-mini}
      - LIBSCOPE_AI_BASE_URL=${LIBSCOPE_AI_BASE_URL:-}
      - LIBSCOPE_AI_TEMPERATURE=${LIBSCOPE_AI_TEMPERATURE:-0.2}
      - LIBSCOPE_AI_MAX_TOKENS=${LIBSCOPE_AI_MAX_TOKENS:-2048}
      - LIBSCOPE_AI_TIMEOUT=${LIBSCOPE_AI_TIMEOUT:-30.0}
      - LIBSCOPE_AI_RETRIES=${LIBSCOPE_AI_RETRIES:-2}
      - LIBSCOPE_AI_DISABLED=${LIBSCOPE_AI_DISABLED:-false}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-}
    volumes:
      - libscope-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  libscope-data:
    driver: local
