name: Desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python application
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[ai]"
          python -m pip install pyinstaller
      - name: Install desktop dependencies
        run: npm ci
      - name: Build installer
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: libscope-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
